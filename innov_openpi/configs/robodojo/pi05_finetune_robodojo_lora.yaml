# LeRobot pi05 LoRA 微调配置 (RoboDojo insert_tubes 链路测试)
# =================================================
# 与 pi05_finetune_robodojo_full.yaml 的差异:
#   - paligemma_variant: gemma_2b_lora(仅 VLM 语言模型注入 LoRA,rank=16)
#   - 冻结 VLM 语言模型主干,仅训练 lora 参数;vision tower / action expert / 投影层照常训练
#   - peak_lr 2.5e-5(对齐 openpi JAX lora 配置)
#
# Usage:
#   PYTHONPATH=/home/kemove/INNOV/sim/RoboDojo \
#   python scripts/train_pytorch.py --config configs/robodojo/pi05_finetune_robodojo_lora.yaml

name: robodojo_pi05_lora
exp_name: insert_tubes_linktest_lora

# ── Model ───────────────────────────────────────────────
model:
  _target_: Pi0Config
  pi05: true
  action_dim: 32
  action_horizon: 50
  max_token_len: 250
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m
  enable_blur_aug: true
  rtc_config:
    enabled: true
    prefix_attention_schedule: LINEAR
    max_guidance_weight: 10.0
    execution_horizon: 15

# ── Data ────────────────────────────────────────────────
data:
  _target_: LeRobotDataConfig
  repo_id: /mnt/databackup/datasets/RoboDojo/data/RoboDojo_lerobot_v21/sim/insert_tubes
  robot_type: dual_x5
  default_prompt: "Insert the three tubes into the rack one by one."
  assets:
    asset_id: robodojo_insert_tubes
  camera_map:
    cam_high: base_0_rgb
    cam_left_wrist: left_wrist_0_rgb
    cam_right_wrist: right_wrist_0_rgb

# ── Weight Loading ─────────────────────────────────────
# base 权重(不含 lora 参数);lora 参数按 normal(stddev=0.01) 随机初始化
weight_loader:
  _target_: CheckpointWeightLoader
  params_path: /home/kemove/INNOV/models/openpi/pi05_base_pytorch

# ── Learning Rate Schedule ─────────────────────────────
lr_schedule:
  _target_: CosineDecaySchedule
  warmup_steps: 100
  peak_lr: 0.000025
  decay_steps: 600
  decay_lr: 0.0000025

# ── Optimizer ───────────────────────────────────────────
optimizer:
  _target_: AdamW
  b1: 0.9
  b2: 0.95
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

# ── Training ────────────────────────────────────────────
batch_size: 32          # 全局 batch(DDP 每卡 16),为 GPU1 上的 sim 评估腾显存
num_train_steps: 600
seed: 42
log_interval: 50
save_interval: 200      # 评估间隔 = save_interval * eval_every = 200 步
keep_period: 10000
fsdp_devices: 1

# ── Eval Hook (RoboDojo insert_tubes) ───────────────────
eval_every: 1
eval_task: insert_tubes
eval_gpu: 1
eval_timeout: 1800

wandb_enabled: false
