# LeRobot pi05 LoRA Fine-Tuning Configuration (innov_arm)
# =================================================
# 与 pi05_finetune_innov_arm.yaml 的差异:
#   - paligemma_variant: gemma_2b_lora(仅 VLM 语言模型注入 LoRA,rank=16)
#   - 冻结 VLM 语言模型主干,仅训练 lora 参数;vision tower / action expert / 投影层照常训练
#   - peak_lr 2.5e-5(对齐 openpi JAX lora 配置)
#
# Usage:
#   python scripts/train_pytorch.py --config configs/innov_arm/pi05_finetune_innov_arm_lora.yaml
#   torchrun --standalone --nnodes=1 --nproc_per_node=4 \
#       scripts/train_pytorch.py --config configs/innov_arm/pi05_finetune_innov_arm_lora.yaml

name: innov_arm_pi05_lora
exp_name: innov_arm_lora_001

# ── Model ───────────────────────────────────────────────
model:
  _target_: Pi0Config
  pi05: true
  action_dim: 32
  action_horizon: 50
  max_token_len: 250
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m
  enable_blur_aug: true  # 中值+运动模糊增强（与 RISE 对齐，各 p=0.1）
  rtc_config:
    enabled: true
    prefix_attention_schedule: LINEAR
    max_guidance_weight: 10.0
    execution_horizon: 15

# ── Data ────────────────────────────────────────────────
data:
  _target_: LeRobotDataConfig
  repo_id: /home/kemove/INNOV/datasets/innov_arm/innov_0730_0731_3cam_clean
  robot_type: bi_innov_arm_v1
  default_prompt: "Put the water flosser into the box and close the lid"
  assets:
    asset_id: innov_3cam_clean
  camera_map:
    front: base_0_rgb
    left_wrist: left_wrist_0_rgb
    right_wrist: right_wrist_0_rgb

# ── Weight Loading ─────────────────────────────────────
# base 权重(不含 lora 参数);lora 参数按 normal(stddev=0.01) 随机初始化
weight_loader:
  _target_: CheckpointWeightLoader
  params_path: /home/kemove/INNOV/models/openpi/pi05_base_pytorch

# ── Learning Rate Schedule ─────────────────────────────
lr_schedule:
  _target_: CosineDecaySchedule
  warmup_steps: 5000
  peak_lr: 0.000025
  decay_steps: 100000
  decay_lr: 0.0000025

# ── Optimizer ───────────────────────────────────────────
optimizer:
  _target_: AdamW
  b1: 0.9
  b2: 0.95
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0

# ── Training ────────────────────────────────────────────
batch_size: 64
num_train_steps: 100000
seed: 42
log_interval: 100
save_interval: 10000
keep_period: 10000
fsdp_devices: 1

wandb_enabled: false
